<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fitness Hub</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="share-qr.js" defer></script>
    
    <!-- ==========================================
         CUSTOM STYLES
         ========================================== -->
    <style>
      /* --- Fonts --- */
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lato:wght@400;700&display=swap");

      /* --- App Shell & Base Setup --- */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        overflow: hidden; /* Lock body scroll */
        background-color: #1c1917;
        background-image: radial-gradient(circle at center, #292524 0%, #1c1917 100%);
        font-family: "Lato", sans-serif;
        color: #d6d3d1;
      }

      /* --- Typography --- */
      h1, h2, .fantasy-font {
        font-family: "Cinzel", serif;
      }

      /* --- Gradients from Original App --- */
      .bg-red { background: linear-gradient(135deg, #ff3b30, #ff2d55); }
      .bg-orange { background: linear-gradient(135deg, #ff9500, #ffcc00); }
      .bg-green { background: linear-gradient(135deg, #34c759, #30d158); }
      .bg-blue { background: linear-gradient(135deg, #007aff, #05a1ff); }
      .bg-indigo { background: linear-gradient(135deg, #5856d6, #5e5ce6); }
      .bg-teal { background: linear-gradient(135deg, #30beca, #5ac8fa); }
      .bg-pink { background: linear-gradient(135deg, #ff2d55, #ff375f); }
      .bg-gray { background: linear-gradient(135deg, #8e8e93, #636366); }
      .bg-purple { background: linear-gradient(135deg, #af52de, #bf5af2); }
      .bg-bronze { background: linear-gradient(135deg, #a2845e, #8a6d4a); }
      .bg-navy { background: linear-gradient(135deg, #1e3a8a, #2563eb); }
      .bg-forest { background: linear-gradient(135deg, #15803d, #22a04b); }
      .bg-cyan { background: linear-gradient(135deg, #0891b2, #06b6d4); }
      .bg-violet { background: linear-gradient(135deg, #6d28d9, #8b5cf6); }
      .bg-maroon { background: linear-gradient(135deg, #7f1d1d, #b91c1c); }
      .bg-slate { background: linear-gradient(135deg, #475569, #334155); }

      /* --- Custom Scrollbar (Grid Area) --- */
      .custom-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: #292524;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: #57534e;
        border-radius: 3px;
      }
      .custom-scroll::-webkit-scrollbar-thumb:hover {
        background: #78716c;
      }

      /* --- Components: Game Cards --- */
      .game-card {
        transition: all 0.2s ease-out;
        border: 1px solid #44403c;
      }
      .game-card:hover {
        transform: translateY(-2px);
        border-color: #f59e0b;
        background-color: #292524;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      }
      .game-card:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  
  <body class="flex flex-col">
    
    <!-- ==========================================
         HEADER
         ========================================== -->
    <header class="h-[10dvh] min-h-[60px] flex items-center justify-center bg-stone-900 border-b-4 border-amber-700 shadow-xl z-40 shrink-0 relative">
      <a href="https://code-lifter.github.io/home/" aria-label="Home"
         class="absolute left-3 sm:left-6 top-1/2 -translate-y-1/2 flex items-center gap-2 px-3 py-2 rounded-lg text-amber-500 border border-amber-700/60 bg-stone-800 hover:bg-stone-700 hover:text-amber-400 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        <span class="hidden sm:inline text-sm font-bold uppercase tracking-wider">Home</span>
      </a>
      <div class="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 flex items-center gap-1.5 sm:gap-2">
        <button type="button" onclick="openShareQR('https://code-lifter.github.io/Fitness/', 'Fitness Hub')" aria-label="Share this site with a QR code"
           class="flex items-center gap-2 p-2 sm:px-3 rounded-lg text-amber-500 border border-amber-700/60 bg-stone-800 hover:bg-stone-700 hover:text-amber-400 transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3M20 17h1"/></svg>
          <span class="hidden sm:inline text-sm font-bold uppercase tracking-wider">Share</span>
        </button>
        <a href="https://github.com/Code-Lifter" target="_blank" rel="noopener noreferrer" aria-label="GitHub"
           class="flex items-center gap-2 p-2 sm:px-3 rounded-lg text-amber-500 border border-amber-700/60 bg-stone-800 hover:bg-stone-700 hover:text-amber-400 transition-colors">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"/></svg>
          <span class="hidden sm:inline text-sm font-bold uppercase tracking-wider">GitHub</span>
        </a>
      </div>
      <h1 class="text-amber-500 font-bold tracking-widest uppercase drop-shadow-md" style="font-size: min(6vw, 4vh)">
        Fitness Hub
      </h1>
    </header>

    <!-- ==========================================
         MAIN CONTENT AREA
         ========================================== -->
    <main class="flex-grow overflow-y-auto custom-scroll relative">
        
      <!-- --- Sticky Search Bar Section --- -->
      <div class="sticky top-0 z-30 pt-3 pb-3 px-3 sm:px-8 border-b border-stone-800 shadow-sm" style="background-color: rgba(28, 25, 23, 0.95); backdrop-filter: blur(8px);">
        <div class="relative max-w-md mx-auto">
            <!-- Search Icon -->
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg class="h-4 w-4 sm:h-5 sm:w-5 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
            <!-- Search Input -->
            <input 
                type="text" 
                id="gameSearch" 
                placeholder="Find a module..." 
                class="block w-full pl-9 sm:pl-10 pr-3 py-1.5 sm:py-3 border border-stone-600 rounded-xl leading-5 bg-stone-800 text-stone-200 placeholder-stone-500 focus:outline-none focus:bg-stone-900 focus:border-amber-500 focus:ring-1 focus:ring-amber-500 text-xs sm:text-base transition-colors shadow-lg"
            >
        </div>
      </div>

      <!-- --- Cards Grid Container --- -->
      <div class="p-3 sm:p-8 max-w-[1400px] mx-auto">
        <!-- Grid: 3 cols on mobile, scaling up for tablet/desktop -->
        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2 sm:gap-5">
          
          <!-- 1RM Max Test (Trending Up) -->
          <a href="1-rep-max.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-indigo relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h20"/><rect x="5" y="6" width="3" height="12" rx="1"/><rect x="16" y="6" width="3" height="12" rx="1"/><rect x="2.5" y="9" width="2.5" height="6" rx="0.5"/><rect x="19" y="9" width="2.5" height="6" rx="0.5"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                1RM Max Test
              </h2>
            </div>
          </a>

          <!-- Food Prep -->
          <a href="https://code-lifter.github.io/Food-Calculator-/" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-green relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Food Prep
              </h2>
            </div>
          </a>
          

          <!-- Body Ratio (Measurement) -->
          <a href="body-ratio.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-teal relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="1.5"/><path d="m9 20 3-6 3 6"/><path d="m6 8 6 2 6-2"/><path d="M12 10v4"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Body Ratio
              </h2>
            </div>
          </a>

          <!-- Breathing (Cloud/Air) -->
          <a href="breathing.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-blue relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Breathing
              </h2>
            </div>
          </a>

          <!-- Cardio (Lightning) -->
          <a href="cardio.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-orange relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Cardio
              </h2>
            </div>
          </a>

          <!-- Heart (Heart) -->
          <a href="heart.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-red relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Heart
              </h2>
            </div>
          </a>

          <!-- Timer (Clock) -->
          <a href="timer.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-purple relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4"/><path d="m12 14 3-3"/><circle cx="12" cy="14" r="8"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Timer
              </h2>
            </div>
          </a>

          <!-- Plate Cal (Calculator) -->
          <a href="rack-master.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-gray relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="5.5"/><circle cx="12" cy="12" r="1.5"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Plate Cal
              </h2>
            </div>
          </a>

          <!-- RPE (Bar Chart) -->
          <a href="rpe.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-pink relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                RPE
              </h2>
            </div>
          </a>

          <!-- Strength Test (Shield Check) -->
          <a href="strength-test.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-bronze relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Strength Test
              </h2>
            </div>
          </a>

          <!-- Drop Set (Trending Down) -->
          <a href="drop-set.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-navy relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="4" width="3.5" height="16" rx="1"/><rect x="7" y="8" width="3.5" height="12" rx="1"/><rect x="12.5" y="12" width="3.5" height="8" rx="1"/><path d="M21 4v10"/><path d="m18.5 11.5 2.5 2.5 2.5-2.5"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Drop Set
              </h2>
            </div>
          </a>

          <!-- Hypertrophy Plan (Calendar) -->
          <a href="hypertrophy-plan.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">
            <div class="absolute inset-0 bg-amber-500 opacity-0 group-hover:opacity-10 transition-opacity z-10 pointer-events-none"></div>
            <div class="w-full aspect-square bg-forest relative flex items-center justify-center p-2">
              <svg class="w-8 h-8 sm:w-16 sm:h-16 text-white drop-shadow-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
            </div>
            <div class="p-1.5 sm:p-3 flex-grow flex items-center justify-center text-center bg-stone-800 border-t border-stone-700 z-20">
              <h2 class="fantasy-font text-xs sm:text-base font-bold text-stone-200 group-hover:text-amber-500 transition-colors leading-tight">
                Hypertrophy Plan
              </h2>
            </div>
          </a>

          <!-- Tempo (Adjustments) -->
          <a href="tempo.html" class="game-card bg-stone-800 rounded-lg sm:rounded-xl flex flex-col group relative overflow-hidden">

    <script>
        // Listen for user typing in the search bar
        document.getElementById('gameSearch').addEventListener('input', function(e) {
            // Get the user's input and convert to lowercase for case-insensitive matching
            const searchTerm = e.target.value.toLowerCase();
            // Select all game card anchor tags
            const cards = document.querySelectorAll('.game-card');

            cards.forEach(card => {
                // Find the game title text inside the card's <h2> element
                const title = card.querySelector('h2').innerText.toLowerCase();
                
                // Toggle card visibility based on whether the title includes the search string
                if (title.includes(searchTerm)) {
                    card.classList.remove('hidden');
                    card.classList.add('flex'); // Restore the required flex layout class
                } else {
                    card.classList.add('hidden'); // Hide unmatched cards
                    card.classList.remove('flex');
                }
            });
        });
    </script>
