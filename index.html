<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fitness Hub</title>
    
    <!-- External Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- ==========================================
         CUSTOM STYLES
         ========================================== -->
    <style>
      /* --- Fonts --- */
      @import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lato:wght@400;700&display=swap");

      /* --- App Shell & Base Setup --- */
      html, body {
        height: 100%;
        width: 100%;
        margin: 0;
        overflow: hidden; /* Lock body scroll */
        background-color: #1c1917;
        background-image: radial-gradient(circle at center, #292524 0%, #1c1917 100%);
        font-family: "Lato", sans-serif;
        color: #d6d3d1;
      }

      /* --- Typography --- */
      h1, h2, .fantasy-font {
        font-family: "Cinzel", serif;
      }

      /* --- Gradients from Original App --- */
      .bg-red { background: linear-gradient(135deg, #ff3b30, #ff2d55); }
      .bg-orange { background: linear-gradient(135deg, #ff9500, #ffcc00); }
      .bg-green { background: linear-gradient(135deg, #34c759, #30d158); }
      .bg-blue { background: linear-gradient(135deg, #007aff, #05a1ff); }
      .bg-indigo { background: linear-gradient(135deg, #5856d6, #5e5ce6); }
      .bg-teal { background: linear-gradient(135deg, #30beca, #5ac8fa); }
      .bg-pink { background: linear-gradient(135deg, #ff2d55, #ff375f); }
      .bg-gray { background: linear-gradient(135deg, #8e8e93, #636366); }

      /* --- Custom Scrollbar (Grid Area) --- */
      .custom-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: #292524;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background: #57534e;
        border-radius: 3px;
      }
      .custom-scroll::-webkit-scrollbar-thumb:hover {
        background: #78716c;
      }

      /* --- Components: Game Cards --- */
      .game-card {
        transition: all 0.2s ease-out;
        border: 1px solid #44403c;
      }
      .game-card:hover {
        transform: translateY(-2px);
        border-color: #f59e0b;
        background-color: #292524;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      }
      .game-card:active {
        transform: scale(0.98);
      }
    </style>
  </head>

            <!-- Search Icon -->

    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->
    <script>
        // Listen for user typing in the search bar
        document.getElementById('gameSearch').addEventListener('input', function(e) {
            // Get the user's input and convert to lowercase for case-insensitive matching
            const searchTerm = e.target.value.toLowerCase();
            // Select all game card anchor tags
            const cards = document.querySelectorAll('.game-card');

            cards.forEach(card => {
                // Find the game title text inside the card's <h2> element
                const title = card.querySelector('h2').innerText.toLowerCase();
                
                // Toggle card visibility based on whether the title includes the search string
                if (title.includes(searchTerm)) {
                    card.classList.remove('hidden');
                    card.classList.add('flex'); // Restore the required flex layout class
                } else {
                    card.classList.add('hidden'); // Hide unmatched cards
                    card.classList.remove('flex');
                }
            });
        });
    </script>
  </body>
</html>
