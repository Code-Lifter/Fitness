<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1RM Calculator & Test Sets</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700;800&family=Teko:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #060a10;
            --surface: #0d1420;
            --border: #1a2336;
            --accent: #f59e0b; 
        }
        * { box-sizing: border-box; }
        body { font-family: 'Syne', system-ui, sans-serif; background: var(--bg); color: #e2e8f0; min-height: 100vh; padding-bottom: 120px; }
        .mono { font-family: 'DM Mono', 'Courier New', monospace; }
        .brand-font { font-family: 'Teko', sans-serif; }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .pulse-active { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }
        .content { position: relative; z-index: 1; }
    </style>
</head>
<body class="selection:bg-amber-500 selection:text-slate-900">

    <nav class="border-b border-slate-800 bg-slate-900/95 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
           <div class="flex items-center gap-2">
                <span class="text-2xl">🛡️</span>
                <h1 class="text-xl font-semibold tracking-wide text-white brand-font uppercase">1 Rep Max <span class="text-amber-500">TEST</span></h1>
            </div>
            <div class="bg-slate-800 p-1 rounded-lg flex text-[10px] sm:text-xs font-bold border border-slate-700">
                <button onclick="setUnit('kg')" id="btn-kg" class="px-3 py-1 rounded-md transition-all bg-amber-500 text-slate-900 shadow font-bold">KG</button>
                <button onclick="setUnit('lbs')" id="btn-lbs" class="px-3 py-1 rounded-md transition-all text-slate-400 hover:text-white font-medium">LBS</button>
            </div>
        </div>
    </nav>

<div class="content max-w-3xl mx-auto px-4 mt-6">
    <div class="space-y-6">
        
        <!-- 1RM CALCULATOR -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-white text-lg uppercase tracking-wide brand-font flex items-center gap-2">
                    <span class="text-amber-500">1.</span> 1 Rep Max Calculator
                </h2>
                <div class="flex bg-slate-950 rounded-lg p-1 border border-slate-800">
                    <button id="mode-direct" onclick="setRmMode('direct')" class="px-2 py-1 text-[9px] font-bold uppercase rounded bg-slate-800 text-slate-300 transition">Direct 1RM</button>
                    <button id="mode-est" onclick="setRmMode('est')" class="px-2 py-1 text-[9px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition">Estimate</button>
                </div>
            </div>

            <div id="rm-direct-container" class="flex items-center gap-4">
                <div class="relative w-full">
                    <input type="number" id="oneRm" oninput="masterCalculate()"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-4xl font-black mono focus:border-amber-500 outline-none transition-all text-white text-center"
                        placeholder="140">
                    <span id="unit-label-direct" class="absolute right-4 top-5 text-slate-600 text-xs font-bold uppercase">KG</span>
                </div>
            </div>

            <div id="rm-est-container" class="hidden gap-3">
                <div class="relative flex-1">
                    <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Weight</label>
                    <input type="number" id="est-weight" oninput="masterCalculate()" placeholder="100" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-2xl font-black mono focus:border-amber-500 outline-none text-white text-center">
                </div>
                <div class="relative flex-1">
                    <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Reps</label>
                    <input type="number" id="est-reps" oninput="masterCalculate()" placeholder="5" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-2xl font-black mono focus:border-amber-500 outline-none text-white text-center">
                </div>
                <div class="flex flex-col items-center justify-center bg-amber-900/10 border border-amber-900/30 rounded-xl px-4 min-w-[100px] mt-4">
                    <span class="text-[9px] text-amber-500 font-bold uppercase tracking-widest mb-1">Calculated</span>
                    <span id="est-result" class="text-2xl font-black mono text-amber-400">—</span>
                </div>
            </div>
            <p id="est-warning" class="hidden mt-3 text-[10px] font-bold uppercase tracking-wide"></p>
        </div>

        <!-- WARMUP PANEL -->
        <div id="warmup-panel" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl shadow-black/20 opacity-50 pointer-events-none transition-opacity">
            <div class="p-4 sm:p-5 bg-slate-950 border-b border-slate-800">
                <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-4">
                    <h3 class="text-white font-bold brand-font text-xl flex items-center gap-2">
                        <span class="text-amber-500">2.</span> Rep Max Test Set
                    </h3>
                    
                    <div class="flex flex-wrap items-end gap-2">
                        <div class="w-24">
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5 text-center">Type</label>
                            <div class="flex bg-slate-900 rounded-lg p-0.5 border border-slate-700 h-8 items-stretch gap-0.5 relative">
                                <button data-value="compound" onclick="setSegment('muscle-type', 'compound')" class="flex-1 text-[10px] font-bold uppercase rounded bg-amber-500 text-slate-900 transition">Comp</button>
                                <button data-value="isolation" onclick="setSegment('muscle-type', 'isolation')" class="flex-1 text-[10px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50">Iso</button>
                                <input type="hidden" id="muscle-type" value="compound">
                            </div>
                        </div>
                        
                        <div class="w-[140px]">
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5 text-center">Rep Target</label>
                            <div class="flex bg-slate-900 rounded-lg p-0.5 border border-slate-700 h-8 items-stretch gap-0.5 relative">
                                <button data-value="1" onclick="setSegment('warmup-target', '1')" class="flex-1 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50">1</button>
                                <button data-value="3" onclick="setSegment('warmup-target', '3')" class="flex-1 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50">3</button>
                                <button data-value="5" onclick="setSegment('warmup-target', '5')" class="flex-1 text-[10px] font-bold rounded bg-amber-500 text-slate-900 transition">5</button>
                                <button data-value="8" onclick="setSegment('warmup-target', '8')" class="flex-1 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50">8</button>
                                <button data-value="10" onclick="setSegment('warmup-target', '10')" class="flex-1 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50">10</button>
                                <input type="hidden" id="warmup-target" value="5">
                            </div>
                        </div>

                        <div class="w-16">
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5 text-center">Bar</label>
                            <input type="number" id="bar-weight" value="20" oninput="masterCalculate()" class="w-full bg-slate-900 text-center text-white text-sm font-bold rounded-lg border border-slate-700 outline-none focus:border-amber-500 h-8 px-1 transition-colors">
                        </div>
                        
                        <div class="w-16">
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5 text-center">Increment</label>
                            <input type="number" id="rounding-factor" value="1.25" step="0.25" oninput="masterCalculate()" class="w-full bg-slate-900 text-center text-white text-sm font-bold rounded-lg border border-slate-700 outline-none focus:border-amber-500 h-8 px-1 transition-colors">
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex flex-col bg-slate-900" id="warmup-container"></div>
        </div>

        <!-- PERCENTAGE REFERENCE -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg">
            <div class="p-3 bg-slate-950 border-b border-slate-800">
                    <h3 class="text-white text-sm font-bold brand-font tracking-wide">Percentage Reference</h3>
            </div>
            <table class="w-full text-left text-slate-400">
                <tbody id="percentage-table-body" class="divide-y divide-slate-800/50"></tbody>
            </table>
        </div>

    </div>
</div>

<!-- TIMER -->
<div id="timer-bar" class="fixed bottom-0 left-0 w-full bg-slate-900 border-t border-amber-500/30 p-3 transform translate-y-full transition-transform duration-300 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
        <div class="flex flex-col">
            <span class="text-[10px] sm:text-xs text-amber-500 uppercase font-bold tracking-widest">Rest Timer</span>
            <span id="timer-display" class="text-2xl sm:text-3xl font-black text-white brand-font font-mono leading-none mt-1">00:00</span>
        </div>
        <div class="flex gap-2">
            <button onclick="addTime(-30)" class="bg-slate-800 hover:bg-slate-700 text-white text-[10px] sm:text-xs px-3 py-2 rounded border border-slate-700 font-bold transition-colors">-30s</button>
            <button onclick="addTime(30)" class="bg-slate-800 hover:bg-slate-700 text-white text-[10px] sm:text-xs px-3 py-2 rounded border border-slate-700 font-bold transition-colors">+30s</button>
            <button onclick="stopTimer()" class="bg-slate-800 hover:bg-red-900/30 hover:border-red-500/50 hover:text-red-400 text-slate-400 text-[10px] sm:text-xs px-4 py-2 rounded border border-slate-700 font-bold uppercase transition-all">Stop</button>
        </div>
    </div>
    <div class="absolute top-0 left-0 h-1 bg-amber-500 transition-all duration-1000 ease-linear" id="timer-progress" style="width: 100%"></div>
</div>

<script>
    let currentUnit = 'kg';
    let rmMode = 'direct';
    let timerInterval;
    let totalTime = 0;
    let remainingTime = 0;
    let audioCtx;
    window.activeStep = 0;

    function setSegment(groupId, value) {
        document.getElementById(groupId).value = value;
        const container = document.getElementById(groupId).parentElement;
        const buttons = container.querySelectorAll('button');
        
        buttons.forEach(btn => {
            if (btn.getAttribute('data-value') === value.toString()) {
                btn.className = 'flex-1 text-[10px] font-bold uppercase rounded bg-amber-500 text-slate-900 transition';
            } else {
                btn.className = 'flex-1 text-[10px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50';
            }
        });
        
        masterCalculate();
    }

    function masterCalculate() {
        let final1RM = 0;
        
        if (rmMode === 'direct') {
            final1RM = parseFloat(document.getElementById('oneRm').value);
        } else {
            const w = parseFloat(document.getElementById('est-weight').value);
            const r = parseFloat(document.getElementById('est-reps').value);
            const resultEl = document.getElementById('est-result');
            const warnEl = document.getElementById('est-warning');

            if (!w || !r) {
                resultEl.innerText = '—';
                warnEl.classList.add('hidden');
                warnEl.classList.remove('block');
            } else {
                final1RM = Math.round(w * (1 + (r / 30)));
                resultEl.innerText = final1RM;
                
                if (r > 10) {
                    warnEl.innerHTML = '🚨 SEVERE ERROR: >10 reps measures local endurance, not CNS strength.';
                    warnEl.className = 'mt-3 text-[10px] text-red-500 font-bold uppercase tracking-wide block';
                } else if (r >= 8) {
                    warnEl.innerHTML = '⚠️ WARNING: Estimating 1RM above 8 reps introduces math errors.';
                    warnEl.className = 'mt-3 text-[10px] text-amber-500/80 font-bold uppercase tracking-wide block';
                } else {
                    warnEl.className = 'hidden';
                    warnEl.classList.remove('block');
                }
            }
        }

        const warmupPanel = document.getElementById('warmup-panel');
        if (final1RM > 0) {
            warmupPanel.classList.remove('opacity-50', 'pointer-events-none');
            const targetReps = parseInt(document.getElementById('warmup-target').value);
            const rounding = parseFloat(document.getElementById('rounding-factor').value);
            const muscleType = document.getElementById('muscle-type').value;
            const standardRounding = currentUnit === 'kg' ? 0.5 : 1.0;
            
            renderWarmup(final1RM, targetReps, rounding, muscleType);
            renderTable(final1RM, standardRounding);
        } else {
            warmupPanel.classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('warmup-container').innerHTML = '';
            document.getElementById('percentage-table-body').innerHTML = '';
        }
    }

    function setRmMode(mode) {
        rmMode = mode;
        document.getElementById('mode-direct').className = mode === 'direct' 
            ? 'px-2 py-1 text-[9px] font-bold uppercase rounded bg-slate-800 text-slate-300 transition' 
            : 'px-2 py-1 text-[9px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition';
            
        document.getElementById('mode-est').className = mode === 'est' 
            ? 'px-2 py-1 text-[9px] font-bold uppercase rounded bg-slate-800 text-slate-300 transition' 
            : 'px-2 py-1 text-[9px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition';

        if (mode === 'direct') {
            document.getElementById('rm-direct-container').classList.remove('hidden');
            document.getElementById('rm-direct-container').classList.add('flex');
            document.getElementById('rm-est-container').classList.add('hidden');
            document.getElementById('rm-est-container').classList.remove('flex');
            document.getElementById('est-warning').classList.add('hidden');
        } else {
            document.getElementById('rm-direct-container').classList.add('hidden');
            document.getElementById('rm-direct-container').classList.remove('flex');
            document.getElementById('rm-est-container').classList.remove('hidden');
            document.getElementById('rm-est-container').classList.add('flex');
        }
        masterCalculate();
    }

    function setUnit(u) {
        const old = currentUnit;
        currentUnit = u;
        
        ['kg','lbs'].forEach(type => {
            const btn = document.getElementById('btn-' + type);
            btn.className = type === u
                ? 'px-3 py-1 rounded-md transition-all bg-amber-500 text-slate-900 shadow font-bold'
                : 'px-3 py-1 rounded-md transition-all text-slate-400 hover:text-white font-medium';
        });

        document.getElementById('unit-label-direct').innerText = u.toUpperCase();

        const factor = (old === 'kg' && u === 'lbs') ? 2.2046 : (old === 'lbs' && u === 'kg') ? 1/2.2046 : 1;

        const oneRmInput = document.getElementById('oneRm');
        if (oneRmInput.value) oneRmInput.value = Math.round(parseFloat(oneRmInput.value) * factor);

        const estWInput = document.getElementById('est-weight');
        if (estWInput.value) estWInput.value = Math.round(parseFloat(estWInput.value) * factor);
        
        const barWInput = document.getElementById('bar-weight');
        if (barWInput.value) barWInput.value = Math.round(parseFloat(barWInput.value) * factor);

        masterCalculate();
    }

    function setActiveStep(index) {
        window.activeStep = index;
        masterCalculate();
    }

    function roundTo(val, step) { return Math.round(val / step) * step; }

    function renderWarmup(oneRM, targetReps, rounding, muscleType) {
        const container = document.getElementById('warmup-container');
        container.innerHTML = ''; 

        const header = document.createElement('div');
        header.className = "flex items-center px-3 sm:px-5 py-3 bg-slate-950/80 border-b border-slate-800 text-[10px] font-bold text-slate-500 uppercase tracking-widest";
        header.innerHTML = `
            <div class="w-8 text-center">Set</div>
            <div class="flex-1 pl-2 text-left">Strategy</div>
            <div class="w-14 text-center">Side</div>
            <div class="w-12 text-center">Load</div>
            <div class="w-10 text-center">Reps</div>
            <div class="w-16 text-center">Rest</div>
        `;
        container.appendChild(header);

        let targetLoad = oneRM / (1 + targetReps / 30);
        const barWeight = parseFloat(document.getElementById('bar-weight').value) || 0;
        const restMult = muscleType === 'isolation' ? 0.5 : 1;

        const steps = [
            { title: "Warm up 1", pct: 0.20, reps: "15", restSec: Math.round(0 * restMult) },
            { title: "Warm up 2", pct: 0.50, reps: "5", restSec: Math.round(60 * restMult) },
            { title: "Warm up 3", pct: 0.70, reps: "3", restSec: Math.round(120 * restMult) },
            { title: "Warm up 4", pct: 0.90, reps: targetReps > 5 ? "2" : "1", restSec: Math.round(180 * restMult) },
            { title: `TEST ${targetReps}RM`, pct: 1.00, reps: targetReps, restSec: Math.round(240 * restMult) }
        ];

        steps.forEach((step, index) => {
            let rawLoad = targetLoad * step.pct;
            let finalLoad = 0;
            let sideBoxText = "—";

            if (barWeight === 0) {
                finalLoad = roundTo(rawLoad, rounding);
            } else {
                if (rawLoad <= barWeight) {
                    finalLoad = barWeight;
                    sideBoxText = "Bar";
                } else {
                    let idealSide = (rawLoad - barWeight) / 2;
                    let roundedSide = roundTo(idealSide, rounding);
                    finalLoad = barWeight + (roundedSide * 2);
                    sideBoxText = roundedSide > 0 ? roundedSide : "Bar";
                }
            }
            
            let isActive = index === window.activeStep;
            let isPast = index < window.activeStep;

            let rowBg = "hover:bg-slate-800/30";
            let badgeBg = "bg-slate-800 text-slate-400 border-slate-700";
            let badgeContent = index + 1;
            let titleClass = "text-slate-300";
            let numColor = "text-white";
            let opacityClass = "opacity-100";
            let cursor = "cursor-pointer";
            let btnClass = "bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white border-slate-700";
            
            if (isPast) {
                opacityClass = "opacity-40 grayscale hover:opacity-70";
            } else if (isActive) {
                rowBg = "bg-slate-800/40 border border-amber-500/50";
                badgeBg = "bg-amber-500 text-slate-900 border-amber-400";
                titleClass = "text-amber-500 font-bold";
                btnClass = "bg-amber-500/20 text-amber-500 border-amber-500/30 hover:bg-amber-500/30";
            } else if (step.pct === 1.0) {
                titleClass = "text-emerald-400 font-bold";
                numColor = "text-emerald-400";
            }

            let restLabel = step.restSec === 0 ? "—" : (step.restSec >= 60 && step.restSec % 60 === 0 ? `${step.restSec/60}m` : `${step.restSec}s`);
            let timerButton = step.restSec > 0 ? 
                `<button onclick="startTimer(${step.restSec})" class="w-full h-8 rounded-lg flex items-center justify-center font-bold uppercase text-[10px] ${btnClass}">
                    ${restLabel}
                </button>` : `<div class="text-slate-500 text-xs text-center">—</div>`;

            const row = document.createElement('div');
            row.className = `flex items-center px-3 sm:px-5 py-3 transition-all duration-300 border-b border-slate-800/50 ${rowBg} ${opacityClass} ${cursor}`;
            row.onclick = (e) => { if (!e.target.closest('button')) setActiveStep(index); };
            
            row.innerHTML = `
                <div class="w-8 text-center flex justify-center">
                    <div class="w-6 h-6 flex items-center justify-center rounded-full text-[10px] border font-bold ${badgeBg}">${badgeContent}</div>
                </div>
                <div class="flex-1 pl-2">
                    <span class="text-sm font-bold ${titleClass}">${step.title}</span>
                </div>
                <div class="w-14 flex justify-center">
                    <div class="bg-slate-950 text-slate-300 font-bold text-xs py-1 px-2 rounded border border-slate-700">${sideBoxText}</div>
                </div>
                <div class="w-12 text-center">
                    <span class="text-lg font-black ${numColor} brand-font">${finalLoad}</span>
                </div>
                <div class="w-10 text-center">
                    <span class="text-lg font-black text-white brand-font">${step.reps}</span>
                </div>
                <div class="w-16 pl-2">${timerButton}</div>
            `;
            container.appendChild(row);
        });
    }

    function renderTable(oneRM, rounding) {
        const tbody = document.getElementById('percentage-table-body');
        tbody.innerHTML = '';
        const data = [
            { pct: 100, reps: '1', zone: 'PWR', span: 3, color: 'text-amber-500', border: 'border-l-2 border-amber-500' }, 
            { pct: 90, reps: '3-4', color: 'text-amber-500' },
            { pct: 85, reps: '5-6', color: 'text-amber-500' }, 
            { pct: 80, reps: '7-8', zone: 'HYP', span: 3, color: 'text-blue-400', border: 'border-l-2 border-blue-500' }, 
            { pct: 75, reps: '9-10', color: 'text-blue-400' },
            { pct: 70, reps: '11-12', color: 'text-blue-400' }, 
            { pct: 60, reps: '16+', zone: 'END', span: 1, color: 'text-emerald-400', border: 'border-l-2 border-emerald-500' }
        ];

        data.forEach((row, index) => {
            let load = roundTo(oneRM * (row.pct / 100), rounding);
            const tr = document.createElement('tr');
            tr.className = `hover:bg-slate-800/40 transition-colors ${index%2===0?'bg-slate-800/20':''}`;
            
            let zoneHtml = row.zone ? `<td rowspan="${row.span}" class="p-0 text-center bg-slate-900/30 ${row.border}">
                <div class="vertical-text text-[9px] font-bold tracking-widest uppercase ${row.color}">${row.zone}</div>
            </td>` : '';

            tr.innerHTML = `${zoneHtml}
                <td class="px-3 py-2 font-bold ${row.color} text-xs">${row.pct}%</td>
                <td class="px-3 py-2 ${row.color} brand-font text-xl">${load}</td>
                <td class="px-3 py-2 text-right text-xs font-bold ${row.color}">${row.reps}</td>`;
            tbody.appendChild(tr);
        });
    }

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function beep() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        gainNode.gain.value = 0.3; osc.frequency.value = 1000; osc.type = 'square';
        osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.15);
    }
    function playAlarm() {
        initAudio(); beep(); setTimeout(beep, 300);
        document.getElementById('timer-display').classList.add('text-red-500', 'pulse-active');
        setTimeout(() => {
            document.getElementById('timer-display').classList.remove('text-red-500', 'pulse-active');
            stopTimer();
        }, 3000);
    }
    function startTimer(seconds) {
        initAudio(); clearInterval(timerInterval);
        totalTime = seconds; remainingTime = seconds;
        document.getElementById('timer-bar').classList.remove('translate-y-full');
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            remainingTime--; updateTimerDisplay();
            if (remainingTime <= 0) { clearInterval(timerInterval); playAlarm(); }
        }, 1000);
    }
    function addTime(sec) {
        remainingTime = Math.max(0, remainingTime + sec);
        if (remainingTime > totalTime) totalTime = remainingTime;
        updateTimerDisplay();
    }
    function stopTimer() {
        clearInterval(timerInterval);
        document.getElementById('timer-bar').classList.add('translate-y-full');
    }
    function updateTimerDisplay() {
        document.getElementById('timer-display').innerText = `${Math.floor(remainingTime / 60).toString().padStart(2, '0')}:${(remainingTime % 60).toString().padStart(2, '0')}`;
        document.getElementById('timer-progress').style.width = `${totalTime > 0 ? (remainingTime / totalTime) * 100 : 0}%`;
    }

    masterCalculate();
</script>
</body>
</html>
