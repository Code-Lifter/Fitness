<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1RM Calculator & Test Sets</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700;800&family=Teko:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #060a10;
            --surface: #0d1420;
            --border: #1a2336;
            --accent: #f59e0b; 
        }
        * { box-sizing: border-box; }
        body { font-family: 'Syne', system-ui, sans-serif; background: var(--bg); color: #e2e8f0; min-height: 100vh; padding-bottom: 120px; }
        .mono { font-family: 'DM Mono', 'Courier New', monospace; }
        .brand-font { font-family: 'Teko', sans-serif; }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        .pulse-active { animation: pulse-red 2s infinite; }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }
        .content { position: relative; z-index: 1; }

        /* ---- Plate breakdown drawer ---- */
        .plate-rack { position: relative; display: flex; align-items: center; min-height: 92px; padding-left: 14px; }
        .plate-rack .sleeve {
            position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            height: 16px; width: 100%;
            background: linear-gradient(to bottom, #9ca3af, #4b5563, #9ca3af);
            border-radius: 0 3px 3px 0;
            border-left: 8px solid #cbd5e1;
            z-index: 0;
        }
        .plate-rack .plate {
            position: relative; z-index: 1; flex-shrink: 0; margin-right: 2px;
            border: 2px solid rgba(0,0,0,0.35); border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            writing-mode: vertical-rl; text-orientation: mixed;
            font-family: 'DM Mono', monospace; font-weight: 500; line-height: 1;
            box-shadow: inset -2px 0 4px rgba(0,0,0,0.25), 2px 0 3px rgba(0,0,0,0.4);
        }
        .drawer-in { animation: drawer-in 0.18s ease-out; }
        @keyframes drawer-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

        /* ---- Tempo ---- */
        #t-settings summary { list-style: none; }
        #t-settings summary::-webkit-details-marker { display: none; }
        #t-settings .t-chev { transition: transform 0.2s; }
        #t-settings[open] .t-chev { transform: rotate(180deg); }
    </style>
</head>
<body class="selection:bg-amber-500 selection:text-slate-900">

<!-- Your placeholder -->
<div id="nav-placeholder"></div>

<div class="content max-w-3xl mx-auto px-4 mt-6">
    <div class="space-y-6">
        
        <!-- 1RM CALCULATOR -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-white text-lg uppercase tracking-wide brand-font flex items-center gap-2">
                    <span class="text-amber-500">1.</span> 1 Rep Max Calculator
                </h2>
                <div class="flex bg-slate-950 rounded-lg p-1 border border-slate-800">
                    <button id="mode-direct" onclick="setRmMode('direct')" class="px-2 py-1 text-[9px] font-bold uppercase rounded bg-slate-800 text-slate-300 transition">Direct 1RM</button>
                    <button id="mode-est" onclick="setRmMode('est')" class="px-2 py-1 text-[9px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition">Estimate</button>
                </div>
            </div>

            <div id="rm-direct-container" class="flex items-center gap-4">
                <div class="relative w-full">
                    <input type="number" id="oneRm" oninput="masterCalculate()"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-4xl font-black mono focus:border-amber-500 outline-none transition-all text-white text-center"
                        placeholder="140">
                    <span id="unit-label-direct" class="absolute right-4 top-5 text-slate-600 text-xs font-bold uppercase">KG</span>
                </div>
            </div>

            <div id="rm-est-container" class="hidden gap-3">
                <div class="relative flex-1">
                    <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Weight</label>
                    <input type="number" id="est-weight" oninput="masterCalculate()" placeholder="100" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-2xl font-black mono focus:border-amber-500 outline-none text-white text-center">
                </div>
                <div class="relative flex-1">
                    <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Reps</label>
                    <input type="number" id="est-reps" oninput="masterCalculate()" placeholder="5" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-2xl font-black mono focus:border-amber-500 outline-none text-white text-center">
                </div>
                <div class="flex flex-col items-center justify-center bg-amber-900/10 border border-amber-900/30 rounded-xl px-4 min-w-[100px] mt-4">
                    <span class="text-[9px] text-amber-500 font-bold uppercase tracking-widest mb-1">Calculated</span>
                    <span id="est-result" class="text-2xl font-black mono text-amber-400">—</span>
                </div>
            </div>
            <p id="est-warning" class="hidden mt-3 text-[10px] font-bold uppercase tracking-wide"></p>
        </div>

        <!-- WARMUP PANEL -->
        <div id="warmup-panel" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl shadow-black/20 opacity-50 pointer-events-none transition-opacity">
            <div class="p-4 sm:p-5 bg-slate-950 border-b border-slate-800">
                <div class="flex flex-col xl:flex-row xl:items-center justify-between gap-4">
                    <div>
                        <h3 class="text-white font-bold brand-font text-xl flex items-center gap-2">
                            <span class="text-amber-500">2.</span> Rep Max Test Set
                        </h3>
                        <p class="text-[10px] text-slate-500 mt-0.5">Tap a side weight to see the plates.</p>
                    </div>
                    
                    <div class="flex flex-wrap items-end gap-2">
                        <div class="w-24">
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5 text-center">Type</label>
                            <div class="flex bg-slate-900 rounded-lg p-0.5 border border-slate-700 h-8 items-stretch gap-0.5 relative">
                                <button data-value="compound" onclick="setSegment('muscle-type', 'compound')" class="flex-1 text-[10px] font-bold uppercase rounded bg-amber-500 text-slate-900 transition">Comp</button>
                                <button data-value="isolation" onclick="setSegment('muscle-type', 'isolation')" class="flex-1 text-[10px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50">Iso</button>
                                <input type="hidden" id="muscle-type" value="compound">
                            </div>
                        </div>
                        
                        <div class="w-[140px]">
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5 text-center">Rep Target</label>
                            <div class="flex bg-slate-900 rounded-lg p-0.5 border border-slate-700 h-8 items-stretch gap-0.5 relative">
                                <button data-value="1" onclick="setSegment('warmup-target', '1')" class="flex-1 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50">1</button>
                                <button data-value="3" onclick="setSegment('warmup-target', '3')" class="flex-1 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50">3</button>
                                <button data-value="5" onclick="setSegment('warmup-target', '5')" class="flex-1 text-[10px] font-bold rounded bg-amber-500 text-slate-900 transition">5</button>
                                <button data-value="8" onclick="setSegment('warmup-target', '8')" class="flex-1 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50">8</button>
                                <button data-value="10" onclick="setSegment('warmup-target', '10')" class="flex-1 text-[10px] font-bold rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50">10</button>
                                <input type="hidden" id="warmup-target" value="5">
                            </div>
                        </div>

                        <div class="w-16">
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5 text-center">Bar</label>
                            <input type="number" id="bar-weight" value="20" oninput="masterCalculate()" class="w-full bg-slate-900 text-center text-white text-sm font-bold rounded-lg border border-slate-700 outline-none focus:border-amber-500 h-8 px-1 transition-colors">
                        </div>
                        
                        <div class="w-16">
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5 text-center">Increment</label>
                            <input type="number" id="rounding-factor" value="1.25" step="0.25" oninput="masterCalculate()" class="w-full bg-slate-900 text-center text-white text-sm font-bold rounded-lg border border-slate-700 outline-none focus:border-amber-500 h-8 px-1 transition-colors">
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex flex-col bg-slate-900" id="warmup-container"></div>
        </div>

        <!-- TEMPO -->
        <div id="tempo-panel" class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl shadow-black/20">
            <div class="p-4 sm:p-5 bg-slate-950 border-b border-slate-800 flex items-center justify-between gap-3">
                <h3 class="text-white font-bold brand-font text-xl flex items-center gap-2">
                    <span class="text-amber-500">3.</span> Tempo
                </h3>
                <div class="text-right leading-tight">
                    <span class="block text-[9px] text-slate-500 font-bold uppercase tracking-widest">E-B-C-T</span>
                    <span id="t-summary" class="mono text-sm font-medium text-amber-400">3-0-1-2</span>
                </div>
            </div>

            <div class="p-4 sm:p-5 flex gap-5">
                <!-- Track -->
                <div class="relative w-14 h-48 bg-slate-950 rounded-full border-2 border-slate-700 overflow-hidden shrink-0">
                    <div id="t-block" class="absolute top-0 left-0 w-full h-12 rounded-full flex items-center justify-center">
                        <span id="t-ball" class="text-white font-black text-2xl brand-font select-none" style="text-shadow: 0 1px 2px rgba(0,0,0,0.5)"></span>
                    </div>
                </div>

                <!-- Status + controls -->
                <div class="flex-1 min-w-0 flex flex-col">
                    <div class="flex justify-between items-start gap-3 min-h-[5.5rem]">
                        <div>
                            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">Reps left</p>
                            <div id="t-reps-left" class="text-5xl font-black text-white brand-font leading-none">0</div>
                        </div>
                        <div class="text-right min-w-0">
                            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mb-1">Phase</p>
                            <p id="t-phase" class="text-lg font-bold text-slate-400 truncate">Ready</p>
                        </div>
                    </div>

                    <div class="mt-auto">
                        <div class="flex items-end gap-2">
                            <div class="w-16 shrink-0">
                                <label for="t-reps" class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5 text-center">Reps</label>
                                <input type="number" id="t-reps" min="1" class="w-full bg-slate-950 text-center text-white text-sm font-bold rounded-lg border border-slate-700 outline-none focus:border-amber-500 h-10 px-1 transition-colors disabled:opacity-50">
                            </div>
                            <button id="t-reset" type="button" class="h-10 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-[10px] font-bold uppercase tracking-wider transition-colors">Reset</button>
                            <button id="t-start" type="button" class="flex-1 h-10 rounded-lg text-xs font-bold uppercase tracking-wider transition-colors shadow-lg bg-amber-500 hover:bg-amber-400 text-slate-900 shadow-amber-500/20">Start set</button>
                        </div>
                        <button id="t-link" type="button" class="hidden"></button>
                    </div>
                </div>
            </div>

            <details id="t-settings" class="border-t border-slate-800">
                <summary class="px-4 sm:px-5 py-3 cursor-pointer select-none flex items-center justify-between text-[10px] font-bold uppercase tracking-widest text-slate-400 hover:text-slate-200 transition-colors">
                    <span>Tempo settings</span>
                    <span class="t-chev text-slate-600 text-xs">▾</span>
                </summary>
                <div class="px-4 sm:px-5 pb-5 space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label for="t-preset" class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5">Preset</label>
                            <select id="t-preset" class="w-full bg-slate-950 border border-slate-700 text-white text-xs font-bold rounded-lg px-2 h-9 outline-none focus:border-amber-500 transition-colors disabled:opacity-50">
                                <option value="" selected>Custom</option>
                                <optgroup label="Hypertrophy / Tension">
                                    <option value="3-1-1-0">3-1-1-0</option>
                                    <option value="4-1-1-0">4-1-1-0</option>
                                </optgroup>
                                <optgroup label="Explosive Power">
                                    <option value="2-0-X-0">2-0-X-0</option>
                                    <option value="1-0-X-0">1-0-X-0</option>
                                </optgroup>
                                <optgroup label="Pause Heavy">
                                    <option value="3-3-1-0">3-3-1-0</option>
                                    <option value="2-2-1-1">2-2-1-1</option>
                                </optgroup>
                                <optgroup label="Continuous Tension">
                                    <option value="2-0-2-0">2-0-2-0</option>
                                </optgroup>
                                <optgroup label="Eccentric Overload">
                                    <option value="5-0-1-0">5-0-1-0</option>
                                    <option value="6-1-1-0">6-1-1-0</option>
                                </optgroup>
                            </select>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5">Start position</label>
                            <div id="t-seg-start" class="flex bg-slate-950 rounded-lg p-0.5 border border-slate-700 h-9 gap-0.5"></div>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5">Countdown</label>
                            <div id="t-seg-prep" class="flex bg-slate-950 rounded-lg p-0.5 border border-slate-700 h-9 gap-0.5"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-4 border-t border-slate-800">
                        <div>
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5"><span class="text-blue-400">↓</span> Eccentric</label>
                            <div id="t-seg-E" class="flex bg-slate-950 rounded-lg p-0.5 border border-slate-700 h-9 gap-0.5"></div>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5"><span class="text-orange-400">—</span> Bottom pause</label>
                            <div id="t-seg-B" class="flex bg-slate-950 rounded-lg p-0.5 border border-slate-700 h-9 gap-0.5"></div>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5"><span class="text-green-400">↑</span> Concentric</label>
                            <div id="t-seg-C" class="flex bg-slate-950 rounded-lg p-0.5 border border-slate-700 h-9 gap-0.5"></div>
                        </div>
                        <div>
                            <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1.5"><span class="text-purple-400">—</span> Top pause</label>
                            <div id="t-seg-T" class="flex bg-slate-950 rounded-lg p-0.5 border border-slate-700 h-9 gap-0.5"></div>
                        </div>
                    </div>
                </div>
            </details>
        </div>

        <!-- PERCENTAGE REFERENCE -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg">
            <div class="p-3 bg-slate-950 border-b border-slate-800">
                    <h3 class="text-white text-sm font-bold brand-font tracking-wide">Percentage Reference (40% - 100%)</h3>
            </div>
            <table class="w-full text-left text-slate-400">
                <tbody id="percentage-table-body" class="divide-y divide-slate-800/50"></tbody>
            </table>
        </div>

    </div>
</div>

<!-- TIMER -->
<div id="timer-bar" class="fixed bottom-0 left-0 w-full bg-slate-900 border-t border-amber-500/30 p-3 transform translate-y-full transition-transform duration-300 z-50 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
        <div class="flex flex-col">
            <span class="text-[10px] sm:text-xs text-amber-500 uppercase font-bold tracking-widest">Rest Timer</span>
            <span id="timer-display" class="text-2xl sm:text-3xl font-black text-white brand-font font-mono leading-none mt-1">00:00</span>
        </div>
        <div class="flex gap-2">
            <button onclick="addTime(-30)" class="bg-slate-800 hover:bg-slate-700 text-white text-[10px] sm:text-xs px-3 py-2 rounded border border-slate-700 font-bold transition-colors">-30s</button>
            <button onclick="addTime(30)" class="bg-slate-800 hover:bg-slate-700 text-white text-[10px] sm:text-xs px-3 py-2 rounded border border-slate-700 font-bold transition-colors">+30s</button>
            <button onclick="stopTimer()" class="bg-slate-800 hover:bg-red-900/30 hover:border-red-500/50 hover:text-red-400 text-slate-400 text-[10px] sm:text-xs px-4 py-2 rounded border border-slate-700 font-bold uppercase transition-all">Stop</button>
        </div>
    </div>
    <div class="absolute top-0 left-0 h-1 bg-amber-500 transition-all duration-1000 ease-linear" id="timer-progress" style="width: 100%"></div>
</div>

<script>

  fetch('nav.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('nav-placeholder').innerHTML = data;
    });

    
    let currentUnit = 'kg';
    let rmMode = 'direct';
    let timerInterval;
    let totalTime = 0;
    let remainingTime = 0;
    let audioCtx;
    window.activeStep = 0;
    window.openPlateRow = null;   // which test-set row has its plate drawer open
    window.currentSteps = null;   // last rendered test-set steps (tempo reads reps from here)
    let plateDrawerAnimate = false;

    const fmt = n => Math.round(n * 1000) / 1000;   // trims float noise like 27.500000001

    function setSegment(groupId, value) {
        document.getElementById(groupId).value = value;
        const container = document.getElementById(groupId).parentElement;
        const buttons = container.querySelectorAll('button');
        
        buttons.forEach(btn => {
            if (btn.getAttribute('data-value') === value.toString()) {
                btn.className = 'flex-1 text-[10px] font-bold uppercase rounded bg-amber-500 text-slate-900 transition';
            } else {
                btn.className = 'flex-1 text-[10px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition hover:bg-slate-800/50';
            }
        });
        
        masterCalculate();
    }

    function masterCalculate() {
        let final1RM = 0;
        
        if (rmMode === 'direct') {
            final1RM = parseFloat(document.getElementById('oneRm').value);
        } else {
            const w = parseFloat(document.getElementById('est-weight').value);
            const r = parseFloat(document.getElementById('est-reps').value);
            const resultEl = document.getElementById('est-result');
            const warnEl = document.getElementById('est-warning');

            if (!w || !r) {
                resultEl.innerText = '—';
                warnEl.classList.add('hidden');
                warnEl.classList.remove('block');
            } else {
                final1RM = Math.round(w * (1 + (r / 30)));
                resultEl.innerText = final1RM;
                
                if (r > 10) {
                    warnEl.innerHTML = '🚨 SEVERE ERROR: >10 reps measures local endurance, not CNS strength.';
                    warnEl.className = 'mt-3 text-[10px] text-red-500 font-bold uppercase tracking-wide block';
                } else if (r >= 8) {
                    warnEl.innerHTML = '⚠️ WARNING: Estimating 1RM above 8 reps introduces math errors.';
                    warnEl.className = 'mt-3 text-[10px] text-amber-500/80 font-bold uppercase tracking-wide block';
                } else {
                    warnEl.className = 'hidden';
                    warnEl.classList.remove('block');
                }
            }
        }

        const warmupPanel = document.getElementById('warmup-panel');
        if (final1RM > 0) {
            warmupPanel.classList.remove('opacity-50', 'pointer-events-none');
            const targetReps = parseInt(document.getElementById('warmup-target').value);
            const rounding = parseFloat(document.getElementById('rounding-factor').value);
            const muscleType = document.getElementById('muscle-type').value;
            const standardRounding = currentUnit === 'kg' ? 0.5 : 1.0;
            
            renderWarmup(final1RM, targetReps, rounding, muscleType);
            renderTable(final1RM, standardRounding);
        } else {
            warmupPanel.classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('warmup-container').innerHTML = '';
            document.getElementById('percentage-table-body').innerHTML = '';
            window.currentSteps = null;
            tRenderLink();
        }
    }

    function setRmMode(mode) {
        rmMode = mode;
        document.getElementById('mode-direct').className = mode === 'direct' 
            ? 'px-2 py-1 text-[9px] font-bold uppercase rounded bg-slate-800 text-slate-300 transition' 
            : 'px-2 py-1 text-[9px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition';
            
        document.getElementById('mode-est').className = mode === 'est' 
            ? 'px-2 py-1 text-[9px] font-bold uppercase rounded bg-slate-800 text-slate-300 transition' 
            : 'px-2 py-1 text-[9px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition';

        if (mode === 'direct') {
            document.getElementById('rm-direct-container').classList.remove('hidden');
            document.getElementById('rm-direct-container').classList.add('flex');
            document.getElementById('rm-est-container').classList.add('hidden');
            document.getElementById('rm-est-container').classList.remove('flex');
            document.getElementById('est-warning').classList.add('hidden');
        } else {
            document.getElementById('rm-direct-container').classList.add('hidden');
            document.getElementById('rm-direct-container').classList.remove('flex');
            document.getElementById('rm-est-container').classList.remove('hidden');
            document.getElementById('rm-est-container').classList.add('flex');
        }
        masterCalculate();
    }

    function setUnit(u) {
        const old = currentUnit;
        currentUnit = u;
        
        ['kg','lbs'].forEach(type => {
            const btn = document.getElementById('btn-' + type);
            btn.className = type === u

    // Fewest plates that make `side` exactly (heaviest plates first on ties).
    // If it can't be made exactly, returns the heaviest load that fits under it.
    function solvePlates(side, plates) {
        const S = 100;   // work in hundredths so 1.25 / 0.25 are whole numbers
        const target = Math.round(side * S);
        const units = plates.map(p => Math.round(p * S)).filter(u => u > 0).sort((a, b) => b - a);
        if (!isFinite(target) || target <= 0 || target > 100000 || !units.length) return { plates: [], loaded: 0 };

        const INF = 1e9;
        const best = new Array(target + 1).fill(INF);
        const pick = new Array(target + 1).fill(0);
        best[0] = 0;
        for (let a = 1; a <= target; a++) {
            for (const u of units) {
                if (u <= a && best[a - u] + 1 < best[a]) { best[a] = best[a - u] + 1; pick[a] = u; }
            }
        }

        let a = target;
        while (a > 0 && best[a] === INF) a--;
        const out = [];
        for (let r = a; r > 0; r -= pick[r]) out.push(pick[r] / S);
        out.sort((x, y) => y - x);
        return { plates: out, loaded: a / S };
    }

    function buildPlateDrawer(side, barWeight) {
        const unit = plateUnit();
        const set = PLATE_SETS[unit];
        const inv = plateInv[unit];
        const avail = set.filter(p => inv.includes(p.w)).map(p => p.w);
        const res = solvePlates(side, avail);
        const short = fmt(side - res.loaded);

        const platesHtml = res.plates.map(w => {
            const p = set.find(x => x.w === w);
            return `<div class="plate" style="height:${p.h}px;width:${p.wd}px;background:${p.bg};color:${p.fg};font-size:${p.fs}px">${w}</div>`;
        }).join('');

        const counts = {};
        res.plates.forEach(w => { counts[w] = (counts[w] || 0) + 1; });
        const countText = Object.keys(counts).map(Number).sort((x, y) => y - x)
            .map(w => counts[w] > 1 ? `${counts[w]}×${w}` : `${w}`).join(' + ');

        let status;
        if (short <= 0) {
            status = `<span class="text-slate-400">Bar ${barWeight} + 2 × ${side} = <span class="text-white font-medium">${fmt(barWeight + side * 2)} ${unit}</span></span>`;
        } else if (!res.plates.length) {
            status = `<span class="text-red-400">None of your plates fit ${side} ${unit} per side.</span>`;
        } else {
            status = `<span class="text-amber-400">⚠ Can't make ${side} exactly with your plates. Closest is ${fmt(barWeight + res.loaded * 2)} ${unit} (${short} short per side).</span>`;
        }

        const chips = set.map(p => {
            const on = inv.includes(p.w);
            return `<button onclick="togglePlateInventory(${p.w})" class="px-2 py-0.5 rounded text-[10px] font-bold mono border transition-colors ${on
                ? 'bg-slate-800 text-white border-slate-600 hover:border-amber-500/60'
                : 'text-slate-600 border-slate-800 line-through hover:text-slate-400'}">${p.w}</button>`;
        }).join('');

        const d = document.createElement('div');
        d.className = `${plateDrawerAnimate ? 'drawer-in ' : ''}px-3 sm:px-5 py-4 bg-slate-950/70 border-b border-slate-800`;
        d.innerHTML = `
            <div class="flex items-center justify-between gap-3">
                <span class="text-[10px] font-bold uppercase tracking-widest text-amber-500">Per side</span>
                <span class="mono text-xs text-slate-300">${countText || '—'}</span>
            </div>
            <div class="plate-rack"><div class="sleeve"></div>${platesHtml}</div>
            <p class="text-[11px] mono leading-snug">${status}</p>
            <div class="flex flex-wrap items-center gap-1.5 mt-3 pt-3 border-t border-slate-800/70">
                <span class="text-[9px] font-bold uppercase tracking-widest text-slate-500 mr-1">My plates</span>${chips}
            </div>`;
        return d;
    }

    // =====================================================================
    // AUDIO + REST TIMER
    // =====================================================================

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    function beep() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        gainNode.gain.value = 0.3; osc.frequency.value = 1000; osc.type = 'square';
        osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.15);
    }
    // Tempo cues: falling pitch down, rising pitch up, flat beep on pauses
    function playTone(phaseType) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const t = audioCtx.currentTime;

        if (phaseType === 'E') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, t);
            osc.frequency.exponentialRampToValueAtTime(150, t + 0.3);
        } else if (phaseType === 'C') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(200, t);
            osc.frequency.exponentialRampToValueAtTime(600, t + 0.3);
        } else if (phaseType === 'T' || phaseType === 'B') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(350, t);
        } else if (phaseType === 'DONE') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, t);
            osc.frequency.setValueAtTime(800, t + 0.1);
        }

        gainNode.gain.setValueAtTime(0.1, t);
        gainNode.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.start();
        osc.stop(t + 0.3);
    }
    function playAlarm() {
        initAudio(); beep(); setTimeout(beep, 300);
        document.getElementById('timer-display').classList.add('text-red-500', 'pulse-active');
        setTimeout(() => {
            document.getElementById('timer-display').classList.remove('text-red-500', 'pulse-active');
            stopTimer();
        }, 3000);
    }
    function startTimer(seconds) {
        initAudio(); clearInterval(timerInterval);
        totalTime = seconds; remainingTime = seconds;
        document.getElementById('timer-bar').classList.remove('translate-y-full');
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            remainingTime--; updateTimerDisplay();
            if (remainingTime <= 0) { clearInterval(timerInterval); playAlarm(); }
        }, 1000);
    }
    function addTime(sec) {
        remainingTime = Math.max(0, remainingTime + sec);
        if (remainingTime > totalTime) totalTime = remainingTime;
        updateTimerDisplay();
    }
    function stopTimer() {
        clearInterval(timerInterval);
        document.getElementById('timer-bar').classList.add('translate-y-full');
    }
    function updateTimerDisplay() {
        document.getElementById('timer-display').innerText = `${Math.floor(remainingTime / 60).toString().padStart(2, '0')}:${(remainingTime % 60).toString().padStart(2, '0')}`;
        document.getElementById('timer-progress').style.width = `${totalTime > 0 ? (remainingTime / totalTime) * 100 : 0}%`;
    }

    // =====================================================================
    // TEMPO PLAYER
    // =====================================================================

    const TEMPO_KEY = 'gymTempoStateV6';   // same key as the standalone tempo page
    const T_TRAVEL = 140;                   // 192px track - 4px border - 48px ball
    const T_COLORS = { READY: '#f59e0b', E: '#3b82f6', B: '#f97316', C: '#22c55e', T: '#a855f7', DONE: '#10b981' };

    let tSettings = { reps: 10, prepTime: 5, startPos: 'Top', tempo: { E: 3, B: 0, C: 1, T: 2 } };
    let tRunning = false;
    let tTimeout = null;
    let tBallInterval = null;
    let tFollowSet = true;   // reps follow the active test set until you type your own

    const tEl = id => document.getElementById(id);
    const tSleep = ms => new Promise(resolve => { tTimeout = setTimeout(resolve, ms); });

    function tLoad() {
        try {
            const s = JSON.parse(localStorage.getItem(TEMPO_KEY));
            if (s && typeof s === 'object') {
                tSettings = Object.assign({}, tSettings, s, { tempo: Object.assign({}, tSettings.tempo, s.tempo || {}) });
            }
        } catch (e) {}
    }
    function tSave() {
        try { localStorage.setItem(TEMPO_KEY, JSON.stringify(tSettings)); } catch (e) {}
    }

    function tInit() {
        tLoad();
        tRenderSegments();
        tEl('t-reps').value = tSettings.reps;

        tEl('t-reps').addEventListener('change', e => {
            tSettings.reps = Math.max(1, parseInt(e.target.value) || 1);
            e.target.value = tSettings.reps;
            tFollowSet = false;
            tSave();
            tIdle();
        });
        tEl('t-preset').addEventListener('change', e => {
            const p = e.target.value.split('-');
            if (p.length === 4) {
                tSettings.tempo = { E: parseInt(p[0]), B: parseInt(p[1]), C: p[2] === 'X' ? 'X' : parseInt(p[2]), T: parseInt(p[3]) };
                tSave();
                tRenderSegments();
                tIdle();
            }
        });
        tEl('t-start').addEventListener('click', tToggle);
        tEl('t-reset').addEventListener('click', tReset);
        tEl('t-link').addEventListener('click', () => {
            if (tRunning) return;
            tFollowSet = true;
            syncTempoReps();
        });
        tIdle();
    }

    function tSegment(id, options, current, onPick, label) {
        const c = tEl(id);
        c.innerHTML = '';
        options.forEach(opt => {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = label ? label(opt) : opt;
            b.className = `flex-1 text-xs font-bold rounded-md transition-all ${opt === current
                ? 'bg-amber-500 text-slate-900 shadow'
                : 'text-slate-500 hover:text-slate-200 hover:bg-slate-800/60'}`;
            b.onclick = () => {
                if (tRunning) return;
                onPick(opt);
                tRenderSegments();
            };
            c.appendChild(b);
        });
    }

    function tSetTempo(key, value) {
        tSettings.tempo[key] = value;
        tEl('t-preset').value = '';
        tSave();
    }

    function tRenderSegments() {
        const tp = tSettings.tempo;
        tSegment('t-seg-start', ['Top', 'Bottom'], tSettings.startPos, v => { tSettings.startPos = v; tSave(); tIdle(); });
        tSegment('t-seg-prep', [0, 3, 5, 10], tSettings.prepTime, v => { tSettings.prepTime = v; tSave(); }, v => v === 0 ? 'Off' : v + 's');
        tSegment('t-seg-E', [1, 2, 3, 4, 5, 6], tp.E, v => tSetTempo('E', v));
        tSegment('t-seg-B', [0, 1, 2, 3, 4], tp.B, v => tSetTempo('B', v));
        tSegment('t-seg-C', ['X', 1, 2, 3, 4, 5], tp.C, v => tSetTempo('C', v));
        tSegment('t-seg-T', [0, 1, 2, 3, 4], tp.T, v => tSetTempo('T', v));
        tEl('t-summary').textContent = `${tp.E}-${tp.B}-${tp.C}-${tp.T}`;
    }

    // Pull reps from whichever test-set row is active (unless you've typed your own)
    function syncTempoReps() {
        if (tFollowSet && !tRunning && window.currentSteps) {
            const step = window.currentSteps[window.activeStep];
            const reps = step ? parseInt(step.reps) : NaN;
            if (reps > 0 && reps !== tSettings.reps) {
                tSettings.reps = reps;
                tEl('t-reps').value = reps;
                tIdle();
            }
        }
        tRenderLink();
    }

    function tRenderLink() {
        const link = tEl('t-link');
        if (!link) return;
        if (!window.currentSteps) { link.className = 'hidden'; return; }
        const n = window.activeStep + 1;
        if (tFollowSet) {
            link.textContent = `Following set ${n}`;
            link.className = 'mt-2 text-[10px] font-bold uppercase tracking-widest text-slate-500 cursor-default';
            link.disabled = true;
        } else {
            link.textContent = `↺ Use set ${n} reps`;
            link.className = 'mt-2 text-[10px] font-bold uppercase tracking-widest text-amber-500 hover:text-amber-400 transition-colors';
            link.disabled = tRunning;
        }
    }

    function tBallStyle(type) {
        const c = T_COLORS[type] || T_COLORS.READY;
        const blk = tEl('t-block');
        blk.style.backgroundColor = c;
        blk.style.boxShadow = `0 0 16px ${c}80`;
    }

    function tStatus(text, color) {
        if (!tRunning) return;
        const ph = tEl('t-phase');
        ph.textContent = text;
        ph.style.color = color;
    }

    function tRepsLeft(n) {
        const el = tEl('t-reps-left');
        const cue = { 3: ['#facc15', '3 left'], 2: ['#f97316', 'Almost'], 1: ['#ef4444', 'Last one!'] }[n];
        el.style.color = '';
        if (cue) {
            el.innerHTML = `<span class="block animate-bounce" style="color:${cue[0]}">${n}</span>` +
                `<span class="block text-[10px] font-bold uppercase tracking-widest animate-pulse mt-1" style="color:${cue[0]};font-family:Syne,sans-serif">${cue[1]}</span>`;
        } else {
            el.textContent = n;
        }
    }

    function tIdle() {
        tEl('tempo-panel').classList.remove('ring-2', 'ring-emerald-500');
        tBallStyle('READY');
        const rl = tEl('t-reps-left');
        rl.textContent = tSettings.reps;
        rl.style.color = '';
        const ph = tEl('t-phase');
        ph.textContent = 'Ready';
        ph.style.color = '';
        tEl('t-ball').textContent = '';

        const blk = tEl('t-block');
        blk.style.transition = 'none';
        blk.style.transform = `translateY(${tSettings.startPos === 'Bottom' ? T_TRAVEL : 0}px)`;
        void blk.offsetHeight;
        tRenderLink();
    }

    function tBallTimer(seconds) {
        clearInterval(tBallInterval);
        const ball = tEl('t-ball');
        if (seconds === 'X') { ball.textContent = '⚡'; return; }
        const s = parseFloat(seconds);
        if (!(s > 0)) { ball.textContent = ''; return; }
        const end = Date.now() + s * 1000;
        ball.textContent = Math.ceil(s);
        tBallInterval = setInterval(() => {
            const left = end - Date.now();
            if (left <= 0) { clearInterval(tBallInterval); ball.textContent = ''; }
            else ball.textContent = Math.ceil(left / 1000);
        }, 50);
    }

    function tMove(y, secs) {
        if (!tRunning) return;
        const blk = tEl('t-block');
        blk.style.transition = `transform ${secs}s linear, background-color 0.3s`;
        blk.style.transform = `translateY(${y}px)`;
    }

    async function tPhase(name, duration, targetY, type) {
        if (!tRunning) return;
        const secs = duration === 'X' ? 0.3 : parseFloat(duration);
        if (secs > 0) playTone(type);
        tBallTimer(duration);
        tBallStyle(type);

        if (targetY !== null) {
            tStatus(name, T_COLORS[type]);
            tMove(targetY, secs);
            await tSleep(secs * 1000);
        } else if (secs > 0) {
            tStatus(name, T_COLORS[type]);
            await tSleep(secs * 1000);
        }
    }

    function tSetRunningUI(running) {
        const btn = tEl('t-start');
        btn.textContent = running ? 'Stop' : 'Start set';
        btn.className = 'flex-1 h-10 rounded-lg text-xs font-bold uppercase tracking-wider transition-colors shadow-lg ' +
            (running ? 'bg-red-600 hover:bg-red-500 text-white shadow-red-500/20'
                     : 'bg-amber-500 hover:bg-amber-400 text-slate-900 shadow-amber-500/20');
        tEl('t-reps').disabled = running;
        tEl('t-preset').disabled = running;
        tRenderLink();
    }

    async function tToggle() {
        if (tRunning) { tReset(); return; }

        initAudio();
        tRunning = true;
        tEl('tempo-panel').classList.remove('ring-2', 'ring-emerald-500');
        tSetRunningUI(true);

        if (tSettings.prepTime > 0) {
            tBallStyle('READY');
            for (let i = tSettings.prepTime; i > 0; i--) {
                if (!tRunning) return;
                tStatus(`Go in ${i}`, '#fb923c');
                tEl('t-ball').textContent = i;
                playTone('T');
                await tSleep(1000);
            }
        }
        if (!tRunning) return;
        tEl('t-ball').textContent = '';

        const order = tSettings.startPos === 'Bottom'
            ? [['Concentric', 'C', 0], ['Top pause', 'T', null], ['Eccentric', 'E', T_TRAVEL], ['Bottom pause', 'B', null]]
            : [['Eccentric', 'E', T_TRAVEL], ['Bottom pause', 'B', null], ['Concentric', 'C', 0], ['Top pause', 'T', null]];

        for (let rep = 1; rep <= tSettings.reps; rep++) {
            if (!tRunning) break;
            tRepsLeft(tSettings.reps - rep + 1);
            for (const [name, key, y] of order) {
                if (!tRunning) break;
                await tPhase(name, tSettings.tempo[key], y, key);
            }
        }

        if (tRunning) {
            const rl = tEl('t-reps-left');
            rl.textContent = '0';
            rl.style.color = T_COLORS.DONE;
            tStatus('Complete!', T_COLORS.DONE);
            tEl('t-ball').textContent = '✓';
            playTone('DONE');
            tBallStyle('DONE');
            tEl('tempo-panel').classList.add('ring-2', 'ring-emerald-500');
            tFinish();
        }
    }

    function tFinish() {
        tRunning = false;
        tSetRunningUI(false);
    }

    function tReset() {
        tRunning = false;
        clearTimeout(tTimeout);
        clearInterval(tBallInterval);
        tFinish();
        tIdle();
    }

    // Boot
    tInit();
    masterCalculate();
</script>
</body>
</html>
