<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Load Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@400;600;700;800&family=Teko:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #060a10;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Syne', system-ui, sans-serif; 
            background: var(--bg); 
            color: #e2e8f0; 
            min-height: 100vh; 
            padding-bottom: 60px; 
        }
        .mono { font-family: 'DM Mono', 'Courier New', monospace; }
        .brand-font { font-family: 'Teko', sans-serif; }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
            z-index: 0;
        }
        .content { position: relative; z-index: 1; }
    </style>
</head>
<body class="selection:bg-amber-500 selection:text-slate-900">

    <nav class="border-b border-slate-800 bg-slate-900/95 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🎯</span>
                <h1 class="text-xl font-semibold tracking-wide text-white brand-font uppercase">Target Load <span class="text-amber-500">Gen</span></h1>
            </div>
            <div class="bg-slate-800 p-1 rounded-lg flex text-[10px] sm:text-xs font-bold border border-slate-700">
                <button onclick="setUnit('kg')" id="btn-kg" class="px-3 py-1 rounded-md transition-all bg-amber-500 text-slate-900 shadow font-bold">KG</button>
                <button onclick="setUnit('lbs')" id="btn-lbs" class="px-3 py-1 rounded-md transition-all text-slate-400 hover:text-white font-medium">LBS</button>
            </div>
        </div>
    </nav>

<div class="content max-w-3xl mx-auto px-4 mt-6">
    <div class="space-y-6">
        
        <!-- 1RM DEFINITION -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-white text-lg uppercase tracking-wide brand-font flex items-center gap-2">
                    <span class="text-amber-500">1.</span> One Rep Max (1RM)
                </h2>
                <div class="flex bg-slate-950 rounded-lg p-1 border border-slate-800">
                    <button id="mode-known" onclick="setRmMode('known')" class="px-2 py-1 text-[9px] font-bold uppercase rounded bg-slate-800 text-slate-300 transition">Known 1RM</button>
                    <button id="mode-calc" onclick="setRmMode('calc')" class="px-2 py-1 text-[9px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition">Calculate</button>
                </div>
            </div>

            <!-- Mode: Known 1RM -->
            <div id="section-known" class="flex items-center gap-4">
                <div class="relative w-full">
                    <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1 text-center">Your Max Weight</label>
                    <input type="number" id="max" oninput="calculateTargetLoad()" step="0.5"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl p-4 text-4xl font-black mono focus:border-amber-500 outline-none transition-all text-white text-center"
                        placeholder="100">
                    <span id="unit-label-max" class="absolute right-4 top-10 text-slate-600 text-xs font-bold uppercase">KG</span>
                </div>
            </div>

            <!-- Mode: Calculate 1RM -->
            <div id="section-calc" class="hidden gap-3">
                <div class="relative flex-1">
                    <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Weight Lifted</label>
                    <input type="number" id="calc-weight" oninput="calculateTargetLoad()" step="0.5" placeholder="85" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-2xl font-black mono focus:border-amber-500 outline-none text-white text-center">
                </div>
                <div class="relative flex-1">
                    <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-1">Reps Done</label>
                    <input type="number" id="calc-reps" oninput="calculateTargetLoad()" placeholder="5" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-2xl font-black mono focus:border-amber-500 outline-none text-white text-center">
                </div>
                <div class="flex flex-col items-center justify-center bg-amber-900/10 border border-amber-900/30 rounded-xl px-4 min-w-[100px] mt-5">
                    <span class="text-[9px] text-amber-500 font-bold uppercase tracking-widest mb-1">Est 1RM</span>
                    <span id="estimated-display" class="text-2xl font-black mono text-amber-400">—</span>
                </div>
            </div>
        </div>

        <!-- TARGET GOALS -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
            <h2 class="text-white text-lg uppercase tracking-wide brand-font flex items-center gap-2 mb-4">
                <span class="text-amber-500">2.</span> Target Parameters
            </h2>

            <div class="mb-6 relative">
                <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-2">Target Reps</label>
                <input type="number" id="reps" oninput="calculateTargetLoad()" placeholder="e.g., 5" min="1"
                       class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-2xl font-black mono focus:border-amber-500 outline-none text-white">
            </div>

            <div>
                <div class="flex justify-between items-end mb-2">
                    <label class="block text-slate-400 text-[10px] font-bold uppercase tracking-widest">Target RPE</label>
                    <span id="rpe-desc" class="text-[10px] text-amber-500 font-bold uppercase tracking-wide text-right italic">2 Reps in Reserve</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-4 bg-slate-950 border border-slate-800 rounded-xl p-4">
                    
                    <div>
                        <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Strength/Power (90-100%)</div>
                        <div class="flex gap-1.5">
                            <button class="rpe-btn flex-1 py-1.5 text-xs font-bold rounded bg-slate-800 text-slate-400 border border-slate-700 transition" data-value="10">10</button>
                            <button class="rpe-btn flex-1 py-1.5 text-xs font-bold rounded bg-slate-800 text-slate-400 border border-slate-700 transition" data-value="9.5">9.5</button>
                            <button class="rpe-btn flex-1 py-1.5 text-xs font-bold rounded bg-slate-800 text-slate-400 border border-slate-700 transition" data-value="9">9</button>
                        </div>
                    </div>

                    <div>
                        <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Str-Hypertrophy (85-92%)</div>
                        <div class="flex gap-1.5">
                            <button class="rpe-btn flex-1 py-1.5 text-xs font-bold rounded bg-slate-800 text-slate-400 border border-slate-700 transition" data-value="8.5">8.5</button>
                            <button class="rpe-btn flex-1 py-1.5 text-xs font-bold rounded bg-amber-500 text-slate-900 border border-amber-400 transition active" data-value="8">8</button>
                        </div>
                    </div>

                    <div>
                        <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Hypertrophy (70-85%)</div>
                        <div class="flex gap-1.5">
                            <button class="rpe-btn flex-1 py-1.5 text-xs font-bold rounded bg-slate-800 text-slate-400 border border-slate-700 transition" data-value="7.5">7.5</button>
                            <button class="rpe-btn flex-1 py-1.5 text-xs font-bold rounded bg-slate-800 text-slate-400 border border-slate-700 transition" data-value="7">7</button>
                        </div>
                    </div>

                    <div>
                        <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Endurance/Volume (60-75%)</div>
                        <div class="flex gap-1.5">
                            <button class="rpe-btn flex-1 py-1.5 text-xs font-bold rounded bg-slate-800 text-slate-400 border border-slate-700 transition" data-value="6.5">6.5</button>
                            <button class="rpe-btn flex-1 py-1.5 text-xs font-bold rounded bg-slate-800 text-slate-400 border border-slate-700 transition" data-value="6">6</button>
                            <button class="rpe-btn flex-1 py-1.5 text-xs font-bold rounded bg-slate-800 text-slate-400 border border-slate-700 transition" data-value="5.5">5.5</button>
                            <button class="rpe-btn flex-1 py-1.5 text-xs font-bold rounded bg-slate-800 text-slate-400 border border-slate-700 transition" data-value="5">5</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- RESULTS -->
        <div id="resultBox" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl text-center opacity-50 pointer-events-none transition-opacity">
            <div class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Target Weight to Load</div>
            <div class="flex items-end justify-center gap-2 mb-2">
                <div id="targetWeight" class="text-6xl font-black mono text-emerald-400 brand-font leading-none">0.0</div>
                <div id="unit-label-res" class="text-xl text-emerald-600 font-bold mb-1">KG</div>
            </div>
            <div id="calcMethod" class="text-[10px] text-slate-500 uppercase font-bold tracking-wide mt-2">Waiting for inputs...</div>
        </div>

    </div>
</div>

<script>
    const rpeChart = {
        1:  { "10": 1.00, "9.5": 0.98, "9": 0.96, "8.5": 0.94, "8": 0.92, "7.5": 0.90, "7": 0.88, "6.5": 0.86, "6": 0.84 },
        2:  { "10": 0.96, "9.5": 0.94, "9": 0.92, "8.5": 0.90, "8": 0.89, "7.5": 0.87, "7": 0.86, "6.5": 0.84, "6": 0.82 },
        3:  { "10": 0.92, "9.5": 0.90, "9": 0.89, "8.5": 0.87, "8": 0.86, "7.5": 0.84, "7": 0.82, "6.5": 0.80, "6": 0.78 },
        4:  { "10": 0.89, "9.5": 0.87, "9": 0.86, "8.5": 0.84, "8": 0.82, "7.5": 0.80, "7": 0.78, "6.5": 0.76, "6": 0.74 },
        5:  { "10": 0.86, "9.5": 0.84, "9": 0.82, "8.5": 0.80, "8": 0.79, "7.5": 0.77, "7": 0.76, "6.5": 0.74, "6": 0.72 },
        6:  { "10": 0.84, "9.5": 0.82, "9": 0.80, "8.5": 0.78, "8": 0.76, "7.5": 0.74, "7": 0.72, "6.5": 0.70, "6": 0.68 },
        7:  { "10": 0.82, "9.5": 0.80, "9": 0.78, "8.5": 0.76, "8": 0.74, "7.5": 0.72, "7": 0.70, "6.5": 0.68, "6": 0.66 },
        8:  { "10": 0.80, "9.5": 0.78, "9": 0.76, "8.5": 0.74, "8": 0.72, "7.5": 0.70, "7": 0.68, "6.5": 0.66, "6": 0.64 },
        9:  { "10": 0.78, "9.5": 0.76, "9": 0.74, "8.5": 0.72, "8": 0.70, "7.5": 0.68, "7": 0.66, "6.5": 0.64, "6": 0.62 },
        10: { "10": 0.76, "9.5": 0.74, "9": 0.72, "8.5": 0.70, "8": 0.68, "7.5": 0.66, "7": 0.64, "6.5": 0.62, "6": 0.60 }
    };

    const rpeDescriptions = {
        "10": "Absolute Max, 0 RIR (Max strength)",
        "9.5": "Maybe 1 more rep (Heavy singles/doubles)",
        "9": "1 Rep in Reserve (Strength development)",
        "8.5": "Maybe 2 more reps (Builds strength/size)",
        "8": "2 Reps in Reserve (Heavy compound work)",
        "7.5": "Maybe 3 more reps (Primary muscle building)",
        "7": "3 Reps in Reserve (Moderate load/reps)",
        "6.5": "Maybe 4 more reps (Metabolic stress)",
        "6": "4 Reps in Reserve (Endurance zone)",
        "5.5": "Maybe 5 more reps (High volume)",
        "5": "5 Reps in Reserve (High rep work)"
    };

    let currentUnit = 'kg';
    let inputMode = 'known';
    let currentRPE = "8";

    // UI Elements
    const maxInput = document.getElementById('max');
    const calcWeightInput = document.getElementById('calc-weight');
    const calcRepsInput = document.getElementById('calc-reps');
    const repsInput = document.getElementById('reps');
    const estimatedDisplay = document.getElementById('estimated-display');
    const rpeButtons = document.querySelectorAll('.rpe-btn');
    const rpeDesc = document.getElementById('rpe-desc');
    const resultBox = document.getElementById('resultBox');
    const resultValue = document.getElementById('targetWeight');
    const methodText = document.getElementById('calcMethod');

    function setRmMode(mode) {
        inputMode = mode;
        document.getElementById('mode-known').className = mode === 'known' 
            ? 'px-2 py-1 text-[9px] font-bold uppercase rounded bg-slate-800 text-slate-300 transition' 
            : 'px-2 py-1 text-[9px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition';
            
        document.getElementById('mode-calc').className = mode === 'calc' 
            ? 'px-2 py-1 text-[9px] font-bold uppercase rounded bg-slate-800 text-slate-300 transition' 
            : 'px-2 py-1 text-[9px] font-bold uppercase rounded text-slate-500 hover:text-slate-300 transition';

        if (mode === 'known') {
            document.getElementById('section-known').classList.remove('hidden');
            document.getElementById('section-known').classList.add('flex');
            document.getElementById('section-calc').classList.add('hidden');
            document.getElementById('section-calc').classList.remove('flex');
        } else {
            document.getElementById('section-known').classList.add('hidden');
            document.getElementById('section-known').classList.remove('flex');
            document.getElementById('section-calc').classList.remove('hidden');
            document.getElementById('section-calc').classList.add('flex');
        }
        calculateTargetLoad();
    }

    function setUnit(u) {
        const old = currentUnit;
        currentUnit = u;
        
        ['kg','lbs'].forEach(type => {
            const btn = document.getElementById('btn-' + type);
            btn.className = type === u
                ? 'px-3 py-1 rounded-md transition-all bg-amber-500 text-slate-900 shadow font-bold'
                : 'px-3 py-1 rounded-md transition-all text-slate-400 hover:text-white font-medium';
        });

        document.getElementById('unit-label-max').innerText = u.toUpperCase();
        document.getElementById('unit-label-res').innerText = u.toUpperCase();

        const factor = (old === 'kg' && u === 'lbs') ? 2.2046 : (old === 'lbs' && u === 'kg') ? 1/2.2046 : 1;

        if (maxInput.value) maxInput.value = Math.round(parseFloat(maxInput.value) * factor * 2) / 2;
        if (calcWeightInput.value) calcWeightInput.value = Math.round(parseFloat(calcWeightInput.value) * factor * 2) / 2;
        
        calculateTargetLoad();
    }

    // Initialize RPE Buttons
    rpeButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            rpeButtons.forEach(b => {
                b.classList.remove('bg-amber-500', 'text-slate-900', 'border-amber-400', 'active');
                b.classList.add('bg-slate-800', 'text-slate-400', 'border-slate-700');
            });
            
            const clickedBtn = e.target;
            clickedBtn.classList.remove('bg-slate-800', 'text-slate-400', 'border-slate-700');
            clickedBtn.classList.add('bg-amber-500', 'text-slate-900', 'border-amber-400', 'active');
            
            currentRPE = clickedBtn.getAttribute('data-value');
            rpeDesc.innerText = rpeDescriptions[currentRPE];
            
            calculateTargetLoad();
        });
    });

    function calculateTargetLoad() {
        let oneRepMax = 0;

        if (inputMode === 'known') {
            oneRepMax = parseFloat(maxInput.value);
        } else {
            const w = parseFloat(calcWeightInput.value);
            const r = parseInt(calcRepsInput.value);
            
            if (!isNaN(w) && !isNaN(r) && r > 0 && w > 0) {
                // Epley Formula for estimating 1RM
                oneRepMax = w * (1 + (0.0333 * r));
                estimatedDisplay.innerText = oneRepMax.toFixed(1);
            } else {
                estimatedDisplay.innerText = '—';
                oneRepMax = NaN;
            }
        }

        const reps = parseInt(repsInput.value);
        const rpe = parseFloat(currentRPE);
        
        if (isNaN(oneRepMax) || isNaN(reps) || reps < 1 || oneRepMax <= 0) {
            resultBox.classList.add('opacity-50', 'pointer-events-none');
            resultValue.innerText = "0.0";
            methodText.innerText = "Waiting for inputs...";
            return;
        }

        let percentage = 0;
        let usedFormula = false;

        // Check if exact match exists in the established table
        if (rpeChart[reps] && rpeChart[reps][currentRPE]) {
            percentage = rpeChart[reps][currentRPE];
            usedFormula = false;
        } else {
            // Modified Epley Formula fallback
            const rir = 10 - rpe;
            const maxReps = reps + rir;
            percentage = 1 / (1 + (0.0333 * maxReps));
            usedFormula = true;
        }

        const targetWeight = oneRepMax * percentage;

        resultValue.innerText = targetWeight.toFixed(1);
        methodText.innerText = usedFormula 
            ? `Loading ${(percentage * 100).toFixed(1)}% of 1RM via Modified Epley Formula` 
            : `Loading ${(percentage * 100).toFixed(1)}% of 1RM via Standard RPE Table`;
        
        resultBox.classList.remove('opacity-50', 'pointer-events-none');
    }
</script>
</body>
</html>
