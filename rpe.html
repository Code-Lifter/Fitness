<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Load Generator</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f5f5f5;
            --text-muted: #a0a0a0;
            --accent: #00d2d3;
            --input-bg: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.5rem;
            color: var(--text-main);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        /* Toggle Switch Styles */
        .toggle-container {
            display: flex;
            background-color: var(--input-bg);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 25px;
            border: 1px solid #333;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .toggle-btn.active {
            background-color: var(--accent);
            color: #121212;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .split-group {
            display: flex;
            gap: 15px;
        }
        
        .split-group > div {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            background-color: var(--input-bg);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .estimated-1rm {
            text-align: right;
            font-size: 0.85rem;
            color: var(--accent);
            margin-top: 8px;
            min-height: 18px;
        }

        /* RPE Segmented Control */
        .rpe-category {
            font-size: 0.75rem;
            color: var(--accent);
            margin: 15px 0 6px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .rpe-category:first-of-type {
            margin-top: 0;
        }

        .rpe-group {
            display: flex;
            gap: 8px;
        }

        .rpe-btn {
            flex: 1;
            padding: 8px 0;
            background-color: var(--input-bg);
            border: 1px solid #333;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .rpe-btn:hover {
            border-color: var(--text-muted);
        }

        .rpe-btn.active {
            background-color: var(--accent);
            color: #121212;
            border-color: var(--accent);
            font-weight: 700;
        }

        .rpe-desc {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 15px;
            min-height: 18px;
            font-style: italic;
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            background-color: var(--input-bg);
            border-radius: 6px;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            border-left: 4px solid var(--accent);
            pointer-events: none;
        }

        .result-box.active {
            opacity: 1;
            transform: translateY(0);
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            margin: 10px 0;
        }

        .calc-method {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Target Load Generator</h1>
        <p class="subtitle">Calculate the exact weight to put on the bar.</p>

        <!-- Toggle Switch for 1RM Mode -->
        <div class="toggle-container">
            <button class="toggle-btn active" id="btn-known">Known 1RM</button>
            <button class="toggle-btn" id="btn-calc">Calculate 1RM</button>
        </div>

        <!-- Mode 1: Known 1RM Input -->
        <div id="section-known" class="input-group">
            <label for="max">Your Known 1RM (Weight)</label>
            <input type="number" id="max" placeholder="e.g., 100" step="0.5" required>
        </div>

        <!-- Mode 2: Calculate 1RM Inputs (Hidden by default) -->
        <div id="section-calc" class="input-group" style="display: none;">
            <div class="split-group">
                <div>
                    <label for="calc-weight">Weight Lifted</label>
                    <input type="number" id="calc-weight" placeholder="e.g., 85" step="0.5">
                </div>
                <div>
                    <label for="calc-reps">Reps Done</label>
                    <input type="number" id="calc-reps" placeholder="e.g., 5" min="1">
                </div>
            </div>
            <div class="estimated-1rm" id="estimated-display"></div>
        </div>

        <!-- Target Goal Inputs -->
        <div class="input-group">
            <label for="reps">Target Reps</label>
            <input type="number" id="reps" placeholder="e.g., 5" min="1" required>
        </div>

        <!-- Categorized RPE Buttons -->
        <div class="input-group">
            <label>Target RPE</label>
            
            <div class="rpe-category">Strength/Power (90-100% 1RM)</div>
            <div class="rpe-group">
                <button class="rpe-btn" data-value="10">10</button>
                <button class="rpe-btn" data-value="9.5">9.5</button>
                <button class="rpe-btn" data-value="9">9</button>
            </div>

            <div class="rpe-category">Strength-Hypertrophy (85-92% 1RM)</div>
            <div class="rpe-group">
                <button class="rpe-btn" data-value="8.5">8.5</button>
                <button class="rpe-btn active" data-value="8">8</button>
            </div>

            <div class="rpe-category">Hypertrophy (70-85% 1RM)</div>
            <div class="rpe-group">
                <button class="rpe-btn" data-value="7.5">7.5</button>
                <button class="rpe-btn" data-value="7">7</button>
            </div>

            <div class="rpe-category">Endurance/Volume (60-75% 1RM)</div>
            <div class="rpe-group">
                <button class="rpe-btn" data-value="6.5">6.5</button>
                <button class="rpe-btn" data-value="6">6</button>
                <button class="rpe-btn" data-value="5.5">5.5</button>
                <button class="rpe-btn" data-value="5">5</button>
            </div>

            <div class="rpe-desc" id="rpe-desc">2 Reps in Reserve (Heavy compound work)</div>
        </div>

        <div class="result-box" id="resultBox">
            <div>Target Weight to Load</div>
            <div class="result-value" id="targetWeight">0</div>
            <div class="calc-method" id="calcMethod"></div>
        </div>
    </div>

    <script>
        const rpeChart = {
            1:  { "10": 1.00, "9.5": 0.98, "9": 0.96, "8.5": 0.94, "8": 0.92, "7.5": 0.90, "7": 0.88, "6.5": 0.86, "6": 0.84 },
            2:  { "10": 0.96, "9.5": 0.94, "9": 0.92, "8.5": 0.90, "8": 0.89, "7.5": 0.87, "7": 0.86, "6.5": 0.84, "6": 0.82 },
            3:  { "10": 0.92, "9.5": 0.90, "9": 0.89, "8.5": 0.87, "8": 0.86, "7.5": 0.84, "7": 0.82, "6.5": 0.80, "6": 0.78 },
            4:  { "10": 0.89, "9.5": 0.87, "9": 0.86, "8.5": 0.84, "8": 0.82, "7.5": 0.80, "7": 0.78, "6.5": 0.76, "6": 0.74 },
            5:  { "10": 0.86, "9.5": 0.84, "9": 0.82, "8.5": 0.80, "8": 0.79, "7.5": 0.77, "7": 0.76, "6.5": 0.74, "6": 0.72 },
            6:  { "10": 0.84, "9.5": 0.82, "9": 0.80, "8.5": 0.78, "8": 0.76, "7.5": 0.74, "7": 0.72, "6.5": 0.70, "6": 0.68 },
            7:  { "10": 0.82, "9.5": 0.80, "9": 0.78, "8.5": 0.76, "8": 0.74, "7.5": 0.72, "7": 0.70, "6.5": 0.68, "6": 0.66 },
            8:  { "10": 0.80, "9.5": 0.78, "9": 0.76, "8.5": 0.74, "8": 0.72, "7.5": 0.70, "7": 0.68, "6.5": 0.66, "6": 0.64 },
            9:  { "10": 0.78, "9.5": 0.76, "9": 0.74, "8.5": 0.72, "8": 0.70, "7.5": 0.68, "7": 0.66, "6.5": 0.64, "6": 0.62 },
            10: { "10": 0.76, "9.5": 0.74, "9": 0.72, "8.5": 0.70, "8": 0.68, "7.5": 0.66, "7": 0.64, "6.5": 0.62, "6": 0.60 }
        };

        const rpeDescriptions = {
            "10": "Absolute Max, 0 RIR (Max strength)",
            "9.5": "Maybe 1 more rep (Heavy singles/doubles)",
            "9": "1 Rep in Reserve (Strength development)",
            "8.5": "Maybe 2 more reps (Builds strength/size)",
            "8": "2 Reps in Reserve (Heavy compound work)",
            "7.5": "Maybe 3 more reps (Primary muscle building)",
            "7": "3 Reps in Reserve (Moderate load/reps)",
            "6.5": "Maybe 4 more reps (Metabolic stress)",
            "6": "4 Reps in Reserve (Endurance zone)",
            "5.5": "Maybe 5 more reps (High volume)",
            "5": "5 Reps in Reserve (High rep work)"
        };

        // UI Elements
        const btnKnown = document.getElementById('btn-known');
        const btnCalc = document.getElementById('btn-calc');
        const sectionKnown = document.getElementById('section-known');
        const sectionCalc = document.getElementById('section-calc');
        const estimatedDisplay = document.getElementById('estimated-display');
        
        // Input Elements
        const maxInput = document.getElementById('max');
        const calcWeightInput = document.getElementById('calc-weight');
        const calcRepsInput = document.getElementById('calc-reps');
        const repsInput = document.getElementById('reps');
        
        // RPE Elements
        const rpeButtons = document.querySelectorAll('.rpe-btn');
        const rpeDesc = document.getElementById('rpe-desc');
        let currentRPE = "8"; // Default
        
        // Result Elements
        const resultBox = document.getElementById('resultBox');
        const resultValue = document.getElementById('targetWeight');
        const methodText = document.getElementById('calcMethod');

        let inputMode = 'known'; // 'known' or 'calc'

        // Toggle Logic for 1RM
        btnKnown.addEventListener('click', () => {
            inputMode = 'known';
            btnKnown.classList.add('active');
            btnCalc.classList.remove('active');
            sectionKnown.style.display = 'block';
            sectionCalc.style.display = 'none';
            calculateTargetLoad();
        });

        btnCalc.addEventListener('click', () => {
            inputMode = 'calc';
            btnCalc.classList.add('active');
            btnKnown.classList.remove('active');
            sectionCalc.style.display = 'block';
            sectionKnown.style.display = 'none';
            calculateTargetLoad();
        });

        // RPE Button Logic
        rpeButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Clear active states
                rpeButtons.forEach(b => b.classList.remove('active'));
                
                // Set new active state
                const clickedBtn = e.target;
                clickedBtn.classList.add('active');
                
                // Update value and description
                currentRPE = clickedBtn.getAttribute('data-value');
                rpeDesc.innerText = rpeDescriptions[currentRPE];
                
                calculateTargetLoad();
            });
        });

        function calculateTargetLoad() {
            let oneRepMax = 0;

            // Determine 1RM based on the active tab
            if (inputMode === 'known') {
                oneRepMax = parseFloat(maxInput.value);
            } else {
                const w = parseFloat(calcWeightInput.value);
                const r = parseInt(calcRepsInput.value);
                
                if (!isNaN(w) && !isNaN(r) && r > 0 && w > 0) {
                    // Epley Formula for estimating 1RM
                    oneRepMax = w * (1 + (0.0333 * r));
                    estimatedDisplay.innerText = `Est. 1RM: ${oneRepMax.toFixed(1)}`;
                } else {
                    estimatedDisplay.innerText = '';
                    oneRepMax = NaN;
                }
            }

            const reps = parseInt(repsInput.value);
            const rpe = parseFloat(currentRPE);
            
            // Hide results if inputs are invalid or missing
            if (isNaN(oneRepMax) || isNaN(reps) || reps < 1 || oneRepMax <= 0) {
                resultBox.classList.remove('active');
                return;
            }

            let percentage = 0;
            let usedFormula = false;

            // Check if exact match exists in the established table
            if (rpeChart[reps] && rpeChart[reps][currentRPE]) {
                percentage = rpeChart[reps][currentRPE];
                usedFormula = false;
            } else {
                // Fallback: Modified Epley Formula (Handles our new RPE 5 and 5.5 smoothly!)
                const rir = 10 - rpe;
                const maxReps = reps + rir;
                percentage = 1 / (1 + (0.0333 * maxReps));
                usedFormula = true;
            }

            // Calculate Target Weight (1RM * Percentage)
            const targetWeight = oneRepMax * percentage;

            // Update UI
            resultValue.innerText = targetWeight.toFixed(1);
            methodText.innerText = usedFormula 
                ? `Loading ${(percentage * 100).toFixed(1)}% of 1RM using Modified Epley Formula` 
                : `Loading ${(percentage * 100).toFixed(1)}% of 1RM using Standard RPE Table`;
            
            resultBox.classList.add('active');
        }

        // Attach event listeners for live updates on inputs
        [maxInput, calcWeightInput, calcRepsInput, repsInput].forEach(element => {
            element.addEventListener('input', calculateTargetLoad);
        });
    </script>
</body>
</html>
